# Attribution arm for the MT + TCLD hybrid: Mean-Teacher + 10 x the anchor term only (tcl_weight 0, no
# cross-frame distribution term). Same recipe as mttcl_w10_* with the W1 term removed.
name: mtanchor_a03_dense
phase: P4
method: mt_tcl
model: dfine_s
iters: 1000
lr: 1e-05
weight_decay: 0.0001
clip_max_norm: 0.1
batch_size: 2
use_frozen: true
use_ema: true
ema_decay: 0.9995
diag_every: 50
eval_every: 250
eval_frame_stride: 3
deltas:
- 1
- 2
- 5
base_stride: 4
max_pairs_per_clip: 400
photometric: 0.0
flow_downscale: 2
criterion:
  tcl:
    mode: sym
    divergence: w1
    w1_scale: 10.0
    temperature: 1.0
    min_kept: 0.8
    sharp_margin: 0.1
    min_denom_pairs: 32
  tcl_weight: 0.0
  motion: hybrid
  use_scale: false
  score_thresh: 0.3
  iou_thresh: 0.8
  nms_iou: 0.7
  min_motion_px: 1.0
  motion_weight: false
  conf_weight: true
  anchor_weight: 0.3
  anchor_iou: 0.7
  l2sp_weight: 0.0
  entropy_floor_weight: 0.0
self_train:
  teacher: ema
  score_thresh: 0.5
  nms_iou: 0.7
  restrict_to_target_classes: false
  student_aug:
    photometric: 0.5
    hflip: true
hybrid_tcl_weight: 10.0

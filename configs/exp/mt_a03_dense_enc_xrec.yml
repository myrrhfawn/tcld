# Cross-recording protocol: adaptation on an unlabeled MOT test recording of the same camera, evaluation on the whole labeled train recording (eval stride 6, no intermediate evals).
# Mean-Teacher baseline under the final schedule: EMA teacher (0.9995) labels the clean view, student trained on a strong view (photometric 0.5 + random hflip) with the upstream D-FINE criterion.
name: mt_a03_dense_enc_xrec
method: st
phase: P4
model: dfine_s
iters: 1000
lr: 1e-05
weight_decay: 0.0001
clip_max_norm: 0.1
batch_size: 2
use_frozen: true
use_ema: true
ema_decay: 0.9995
diag_every: 50
eval_every: 0
eval_frame_stride: 6
deltas:
- 1
- 2
- 5
base_stride: 4
max_pairs_per_clip: 400
photometric: 0.0
flow_downscale: 2
self_train:
  teacher: ema
  score_thresh: 0.5
  nms_iou: 0.7
  restrict_to_target_classes: false
  student_aug:
    photometric: 0.5
    hflip: true
criterion:
  motion: none
  anchor_weight: 0.0
freeze:
- backbone

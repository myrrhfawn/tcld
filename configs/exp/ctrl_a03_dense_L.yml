# Control for tf_a03_w5_n16_iou08_dense_L: tcl_weight 0.0, everything else identical.
# Derived by scripts/make_paper_configs.py.
base_stride: 4
batch_size: 1
clip_max_norm: 0.1
criterion:
  anchor_iou: 0.7
  anchor_weight: 0.3
  conf_weight: true
  entropy_floor_weight: 0.0
  iou_thresh: 0.8
  l2sp_weight: 0.0
  min_motion_px: 1.0

  use_scale: false
deltas:
- 1
- 2
- 5
diag_every: 50
ema_decay: 0.9995
eval_every: 250
eval_frame_stride: 3
flow_downscale: 2
iters: 1000
lr: 1e-05
max_pairs_per_clip: 400
method: tcld
model: dfine_l
name: ctrl_a03_dense_L
phase: P4
photometric: 0.0
use_ema: true
use_frozen: true
weight_decay: 0.0001
